<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Nicolas Murtha — Desenvolvedor Full Stack</title>
    <meta name="author" content="Nicolas Murtha" />
    <meta
      name="description"
      content="Portfólio de Nicolas Murtha, desenvolvedor full stack com foco em aplicações web, integração de sistemas, automação e IA."
    />
    <meta property="og:title" content="Nicolas Murtha — Desenvolvedor Full Stack" />
    <meta
      property="og:description"
      content="Portfólio de Nicolas Murtha, desenvolvedor full stack com foco em aplicações web, integração de sistemas, automação e IA."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nicolas Murtha" />
    <meta property="og:url" content="https://nicolasmurtha.github.io/portfolio/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <!-- Imagem da prévia ao compartilhar o link (WhatsApp, LinkedIn, etc.) — precisa de URL absoluta -->
    <meta property="og:image" content="https://nicolasmurtha.github.io/portfolio/og-image.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="N. — Nicolas Murtha" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://nicolasmurtha.github.io/portfolio/og-image.png?v=1" />
    <link rel="icon" href="%BASE_URL%favicon.ico?v=2" type="image/x-icon" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!-- Aplica o tema salvo antes da renderização (evita "piscar") -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
